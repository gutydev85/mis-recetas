<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a1512"><link rel="manifest" href="manifest.json"><title>Mi Recetario</title><style>:root{--bg:#1a1512;--surface:#242019;--raised:#2e2820;--border:#45382c;--text:#fff5eb;--muted:#b9a996;--accent:#d4a574;--danger:#e85d5d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}#app{max-width:650px;margin:auto;min-height:100vh}.header{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px}.header h1{font-size:18px;margin:0;flex:1}main{padding:16px}.view{display:none}.view.active{display:block}.search,input,textarea,select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;width:100%;outline:0}.search{margin-bottom:16px}button{border:0;border-radius:11px;padding:11px 14px;background:var(--raised);color:var(--text);cursor:pointer}.primary{background:var(--accent);color:#1a1512;font-weight:700}.danger{color:#fff;background:var(--danger)}.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;margin:10px 0}.card{display:flex;gap:12px;align-items:center}.info{flex:1}.muted{color:var(--muted);font-size:13px}.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;font-size:25px;background:var(--accent);color:#1a1512}label{display:block;color:var(--muted);font-size:13px;margin:16px 0 7px}textarea{min-height:130px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:110px}.step{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);line-height:1.45}.step input{width:20px;flex:0 0 20px;padding:0;accent-color:var(--accent)}.step.done span{text-decoration:line-through;opacity:.5}.timer{padding:14px;border:1px solid var(--border);border-radius:12px;margin:10px 0;background:var(--surface)}.timer h3{margin:0 0 8px;font-size:15px}.clock{text-align:center;font-size:38px;font-variant-numeric:tabular-nums;margin:10px 0}.timer .actions button{flex:0 0 auto}.progress{color:var(--accent);font-size:13px;margin:10px 0}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modal>div{background:var(--raised);padding:20px;border-radius:16px;width:min(420px,100%)}.note{border-left:3px solid var(--accent);padding:12px;background:#d4a57418;white-space:pre-wrap;color:var(--muted);line-height:1.5}</style></head><body><div id="app">
<section id="home" class="view active"><header class="header"><h1>🍲 Mi Recetario</h1><button onclick="showFavorites()">★</button><button onclick="showSettings()">⚙</button></header><main><input class="search" id="search" placeholder="Buscar receta..." oninput="searchRecipes(this.value)"><div id="stats" class="muted"></div><div id="categories"></div></main><button class="fab" onclick="newCategory()">＋</button></section>
<section id="list" class="view"><header class="header"><button onclick="goHome()">‹</button><h1 id="listTitle">Recetas</h1></header><main><div id="recipeList"></div></main></section>
<section id="form" class="view"><header class="header"><button onclick="goBack()">‹</button><h1 id="formTitle">Nueva receta</h1><button onclick="saveRecipe()">✓</button></header><main><label>Nombre</label><input id="rName"><label>Categoría</label><select id="rCategory"></select><label>Ingredientes (uno por línea)</label><textarea id="rIngredients"></textarea><label>Preparación (cada línea se convierte en un paso completables)</label><textarea id="rSteps"></textarea><label>Porciones base</label><input id="rServings" type="number" min="1" value="4"><label>Tiempo total aproximado (minutos)</label><input id="rTime" type="number" min="0"><label>Nota final / consejo</label><textarea id="rNote" placeholder="Ej.: No batir demasiado..."></textarea><label>Cronómetros</label><div id="timerEditor"></div><button onclick="addTimerEditor()">＋ Añadir cronómetro</button><br><br><button class="primary" style="width:100%" onclick="saveRecipe()">Guardar receta</button></main></section>
<section id="detail" class="view"><header class="header"><button onclick="goBack()">‹</button><h1 id="detailTitle"></h1><button onclick="editCurrent()">✎</button></header><main><div id="detailContent"></div></main></section>
<section id="cook" class="view"><header class="header"><button onclick="showDetail(current.id)">‹</button><h1>Modo cocinar</h1></header><main><div id="cookProgress" class="progress"></div><div class="panel" style="text-align:center"><div id="currentStep" style="font-size:21px;line-height:1.5"></div></div><div class="actions"><button onclick="previousStep()">← Anterior</button><button class="primary" onclick="nextStep()">Siguiente →</button></div><div id="cookAllSteps"></div></main></section>
<section id="settings" class="view"><header class="header"><button onclick="goHome()">‹</button><h1>Ajustes</h1></header><main><button style="width:100%;margin:6px 0" onclick="exportData()">Exportar recetas</button><button style="width:100%;margin:6px 0" onclick="document.getElementById('importFile').click()">Importar recetas</button><input id="importFile" type="file" accept=".json" class="hidden" onchange="importData(this)"><button class="danger" style="width:100%;margin:6px 0" onclick="clearAll()">Borrar todo</button></main></section>
<div id="modal" class="modal"><div><h3 id="modalTitle"></h3><p id="modalText" class="muted"></p><div class="actions"><button onclick="closeModal()">Cancelar</button><button class="danger" id="modalOk">Confirmar</button></div></div></div></div>
<script>
const KEY='mi-recetario-v4';let data={categories:[],recipes:[]},current=null,editingId=null,cookIndex=0,editorTimers=[],intervals={};const $=id=>document.getElementById(id),uid=p=>p+Date.now()+Math.random().toString(36).slice(2,7),lines=s=>String(s||'').split(/\n/).map(x=>x.trim()).filter(Boolean),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function load(){data=JSON.parse(localStorage.getItem(KEY)||'null')||{categories:[],recipes:[]};data.recipes=data.recipes.map(normalize);if(!data.categories.length)data.categories=[{id:uid('c'),name:'Mis recetas'}];save();renderHome()}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function normalize(r){return {...r,ingredients:Array.isArray(r.ingredients)?r.ingredients:lines(r.ingredientes),steps:Array.isArray(r.steps)?r.steps:lines(r.pasos),servingsBase:+r.servingsBase||4,timers:Array.isArray(r.timers)?r.timers:[],note:r.note||'',favorite:!!r.favorite}}function showView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}function goHome(){showView('home');renderHome()}function goBack(){if(current&&editingId)showDetail(current.id);else goHome()}
function renderHome(){$('stats').textContent=`${data.recipes.length} recetas · ${data.recipes.filter(r=>r.favorite).length} favoritas · ${data.categories.length} categorías`;$('categories').innerHTML=data.categories.map(c=>`<div class="card" onclick="showList('${c.id}')"><div style="font-size:24px">📁</div><div class="info"><b>${esc(c.name)}</b><div class="muted">${data.recipes.filter(r=>r.categoryId===c.id).length} recetas</div></div></div>`).join('')||'<p class="muted">No hay categorías.</p>'}function showList(catId){$('listTitle').textContent=data.categories.find(c=>c.id===catId)?.name||'Recetas';renderList(data.recipes.filter(r=>r.categoryId===catId));showView('list')}function renderList(list){$('recipeList').innerHTML=list.length?list.map(r=>`<div class="card" onclick="showDetail('${r.id}')"><div class="info"><b>${esc(r.name)}</b><div class="muted">${r.steps.length} pasos · ${r.timers.length} cronómetros · ${r.servingsBase} porciones</div></div><button onclick="event.stopPropagation();toggleFavorite('${r.id}')">${r.favorite?'★':'☆'}</button></div>`).join(''):'<p class="muted">No hay recetas.</p>'}function showFavorites(){ $('listTitle').textContent='Favoritas';renderList(data.recipes.filter(r=>r.favorite));showView('list')}function searchRecipes(q){if(!q.trim())return goHome();let n=q.toLowerCase();$('listTitle').textContent='Resultados';renderList(data.recipes.filter(r=>(r.name+' '+r.ingredients.join(' ')+' '+r.steps.join(' ')).toLowerCase().includes(n)));showView('list')}
function newCategory(){let name=prompt('Nombre de la categoría');if(name?.trim()){data.categories.push({id:uid('c'),name:name.trim()});save();renderHome()}}function showSettings(){showView('settings')}
function showForm(id=null){editingId=id;editorTimers=[];let r=id?data.recipes.find(x=>x.id===id):null;$('formTitle').textContent=r?'Editar receta':'Nueva receta';$('rName').value=r?.name||'';$('rIngredients').value=r?.ingredients.join('\n')||'';$('rSteps').value=r?.steps.join('\n')||'';$('rServings').value=r?.servingsBase||4;$('rTime').value=r?.time||'';$('rNote').value=r?.note||'';$('rCategory').innerHTML=data.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('rCategory').value=r?.categoryId||data.categories[0]?.id||'';editorTimers=(r?.timers||[]).map(t=>({...t}));renderTimerEditor();showView('form')}function editCurrent(){showForm(current.id)}function addTimerEditor(){editorTimers.push({id:uid('t'),name:'Nuevo cronómetro',duration:60});renderTimerEditor()}function renderTimerEditor(){$('timerEditor').innerHTML=editorTimers.map((t,i)=>`<div class="panel"><input class="timerName" data-i="${i}" value="${esc(t.name)}" placeholder="¿Para qué es?"><br><br><input class="timerMinutes" data-i="${i}" type="number" min="1" value="${Math.ceil(t.duration/60)}"><br><br><button class="danger" onclick="editorTimers.splice(${i},1);renderTimerEditor()">Eliminar</button></div>`).join('')}
function saveRecipe(){let name=$('rName').value.trim();if(!name)return alert('Escribe el nombre de la receta');editorTimers=editorTimers.map((t,i)=>({id:t.id,name:document.querySelector(`.timerName[data-i="${i}"]`)?.value.trim()||'Cronómetro',duration:Math.max(60,+document.querySelector(`.timerMinutes[data-i="${i}"]`)?.value||1)*60}));let old=editingId?data.recipes.find(r=>r.id===editingId):null;let r={id:editingId||uid('r'),name,categoryId:$('rCategory').value,ingredients:lines($('rIngredients').value),steps:lines($('rSteps').value),servingsBase:Math.max(1,+$('rServings').value||1),time:Math.max(0,+$('rTime').value||0),note:$('rNote').value.trim(),timers:editorTimers,favorite:old?.favorite||false};if(old)data.recipes[data.recipes.indexOf(old)]=r;else data.recipes.push(r);save();current=r;showDetail(r.id)}
function showDetail(id){current=data.recipes.find(r=>r.id===id);if(!current)return;$('detailTitle').textContent=current.name;$('detailContent').innerHTML=`<div class="panel"><b>Porciones</b><div class="actions" style="margin-top:10px"><button onclick="changeServings(-1)">−</button><button id="servingValue">${current.servingsBase} porciones</button><button onclick="changeServings(1)">＋</button></div></div><h3>Ingredientes</h3><div>${current.ingredients.map(x=>`<div class="card">${esc(x)}</div>`).join('')}</div><h3>Preparación</h3><div>${current.steps.map(x=>`<label class="step"><input type="checkbox"><span>${esc(x)}</span></label>`).join('')}</div><button class="primary" style="width:100%;margin:18px 0" onclick="startCooking()">▶ Empezar a cocinar</button><h3>Cronómetros</h3><div>${current.timers.length?current.timers.map(t=>timerHTML(t)).join(''):'<p class="muted">No hay cronómetros.</p>'}</div>${current.note?`<h3>Nota final</h3><div class="note">${esc(current.note)}</div>`:''}<p class="muted">Tiempo total aproximado: ${current.time||0} min</p><button class="danger" style="width:100%;margin-top:18px" onclick="deleteCurrent()">Eliminar receta</button>`;showView('detail')}
function changeServings(delta){current.servingsBase=Math.max(1,current.servingsBase+delta);$('servingValue').textContent=current.servingsBase+' porciones';save()}function toggleFavorite(id){let r=data.recipes.find(x=>x.id===id);if(r){r.favorite=!r.favorite;save();renderHome()}}
function timerHTML(t){return `<div class="timer"><h3>${esc(t.name)}</h3><div class="clock" id="clock-${t.id}">${formatTime(t.duration)}</div><div class="actions"><button class="primary" onclick="runTimer('${t.id}')">▶ Iniciar</button><button onclick="pauseTimer('${t.id}')">Ⅱ Pausar</button><button onclick="resetTimer('${t.id}')">↻</button></div></div>`}function formatTime(s){return String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0')}function runTimer(id){let t=current.timers.find(x=>x.id===id);if(!t||intervals[id])return;intervals[id]=setInterval(()=>{t.duration--;let el=$('clock-'+id);if(el)el.textContent=formatTime(t.duration);if(t.duration<=0){pauseTimer(id);alert('⏰ '+t.name+' terminó')}},1000)}function pauseTimer(id){clearInterval(intervals[id]);delete intervals[id]}function resetTimer(id){pauseTimer(id);let t=current.timers.find(x=>x.id===id);t.duration=t.originalDuration||60;let el=$('clock-'+id);if(el)el.textContent=formatTime(t.duration)}
function startCooking(){cookIndex=0;renderCook();showView('cook')}function renderCook(){$('cookProgress').textContent=`Paso ${Math.min(cookIndex+1,current.steps.length)} de ${current.steps.length}`;$('currentStep').textContent=current.steps[cookIndex]||'🎉 ¡Receta terminada!';$('cookAllSteps').innerHTML=current.steps.map((s,i)=>`<div class="step ${i<cookIndex?'done':''}" onclick="cookIndex=${i};renderCook()"><span>${i+1}. ${esc(s)}</span></div>`).join('')}function nextStep(){if(cookIndex<current.steps.length-1){cookIndex++;renderCook()}else alert('🎉 ¡Has terminado todos los pasos!')}function previousStep(){if(cookIndex>0){cookIndex--;renderCook()}}
function deleteCurrent(){openModal('Eliminar receta','Esta acción no se puede deshacer.',()=>{data.recipes=data.recipes.filter(r=>r.id!==current.id);save();goHome()})}function openModal(title,text,cb){$('modalTitle').textContent=title;$('modalText').textContent=text;$('modal').classList.add('open');$('modalOk').onclick=()=>{closeModal();cb()}}function closeModal(){$('modal').classList.remove('open')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='mi-recetario-backup.json';a.click()}function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);data.recipes=data.recipes.map(normalize);save();goHome()}catch{alert('Archivo no válido')}};r.readAsText(f)}function clearAll(){openModal('Borrar todo','Se eliminarán todas las recetas y categorías.',()=>{data={categories:[],recipes:[]};save();goHome()})}load();
</script></body></html>
